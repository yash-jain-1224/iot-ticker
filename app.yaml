# Databricks Apps Configuration
# IoT Ticker Platform

name: iot-ticker
description: Enterprise IoT Monitoring Platform for Auronix Motors Manufacturing

# Application entrypoint
command:
  - uvicorn
  - app.main:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

# Environment variables
env:
  - name: APP_NAME
    value: "IoT Ticker"
  - name: ENVIRONMENT
    value: "production"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: iot-ticker-secrets
        key: database-url
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: iot-ticker-secrets
        key: secret-key
  - name: DATABRICKS_HOST
    valueFrom:
      secretKeyRef:
        name: iot-ticker-secrets
        key: databricks-host
  - name: DATABRICKS_TOKEN
    valueFrom:
      secretKeyRef:
        name: iot-ticker-secrets
        key: databricks-token

# Resource requirements
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

# Health checks
healthCheck:
  path: /health
  port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Scaling configuration
replicas:
  min: 1
  max: 5

# Network configuration
ingress:
  enabled: true
  path: /
  
# Static files serving (frontend)
staticFiles:
  enabled: true
  path: /static
  directory: frontend/dist
